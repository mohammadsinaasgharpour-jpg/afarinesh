# Unit tests on every push and pull request, on a runner that has PHP, so the PHP sitemap is tested too.
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: PHP version
        run: php -v
      - name: Unit tests
        run: node --test tests/*.test.mjs
