# Manual check of the live site's voice relay from outside Iran: a short spoken address goes through
# /api/transcribe (host -> Vercel -> Gemini) with a phone browser's headers. Runs by hand, or when this file changes.
name: live-check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/live-check.yml]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Voice address
        env:
          UA: "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36"
        run: |
          sudo apt-get -qq install -y espeak-ng ffmpeg >/dev/null
          espeak-ng -w voice.wav "Shiraz, Zand street, alley eight, number twelve"
          ffmpeg -loglevel error -i voice.wav -c:a libopus voice.webm
          for f in webm wav; do
            printf '{"type":"audio/%s","audio":"%s"}' "$f" "$(base64 -w0 voice.$f)" > body.json
            curl -s -o out.txt -w "HTTP %{http_code} for $f: " -A "$UA"               -H "Origin: https://afarineshshiraz.ir" -H "Referer: https://afarineshshiraz.ir/pre-registration"               -H "Accept-Language: fa-IR,fa;q=0.9" -H "Content-Type: application/json"               --data-binary @body.json https://afarineshshiraz.ir/api/transcribe
            head -c 300 out.txt; echo
          done
