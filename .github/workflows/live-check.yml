# Manual check of the live site's relays from outside Iran: a short spoken address goes through /api/transcribe
# (host -> Vercel -> Gemini), and a panel login code goes through the Telegram relay. Run by hand only.
name: live-check
on: workflow_dispatch
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Voice address
        run: |
          sudo apt-get -qq install -y espeak-ng >/dev/null
          espeak-ng -w voice.wav "Shiraz, Zand street, alley eight, number twelve"
          curl -s -w ' HTTP %{http_code}\n' -X POST -H "Content-Type: audio/wav" --data-binary @voice.wav https://afarineshshiraz.ir/api/transcribe
      - name: Telegram login code
        run: curl -s -w ' HTTP %{http_code}\n' -X POST -H "Content-Type: application/json" -d '{}' "https://afarineshshiraz.ir/api/admin?action=send-code"
