# Puts main on the live site. The host's firewall refuses GitHub's webhook calls, so the site is asked to deploy
# from here instead: after each push, and every 15 minutes as a fallback (?poll=1 does nothing unless main moved).
name: deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions: {}
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ask the site to deploy main
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o out.json -w '%{http_code}' -X POST --max-time 150 "https://afarineshshiraz.ir/api/deploy?poll=1")
            cat out.json; echo
            [ "$code" = 200 ] && exit 0
            sleep 65
          done
          exit 1
      # Bing (and Yandex, Naver, Seznam) hear about every page right after a push instead of waiting for a crawl.
      # The key is public by design: it only proves the site owns the list, it grants no access.
      - name: Tell IndexNow search engines about the pages
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          sleep 20
          urls=$(curl -s --max-time 60 https://afarineshshiraz.ir/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | head -9000 | jq -R . | jq -s .)
          jq -n --argjson u "$urls" '{host:"afarineshshiraz.ir",key:"b3a153acb7e0da70fa1cfda4f63e4c5b",keyLocation:"https://afarineshshiraz.ir/b3a153acb7e0da70fa1cfda4f63e4c5b.txt",urlList:$u}' > indexnow.json
          curl -s -o /dev/null -w 'IndexNow: %{http_code}\n' -X POST -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json https://api.indexnow.org/indexnow
